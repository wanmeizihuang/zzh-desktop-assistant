name: 缺陷报告
description: 报告可复现的功能异常
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: 安全漏洞请使用 GitHub Security Advisory 私下报告，不要填写此表单。
  - type: input
    id: version
    attributes:
      label: 助手版本
      placeholder: 例如 0.1.2
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows 版本
      placeholder: 例如 Windows 11 24H2 x64
    validations:
      required: true
  - type: textarea
    id: hardware
    attributes:
      label: 相关硬件
      description: 温度、GPU 或性能问题请填写 CPU、GPU 和主板型号。
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: 请按顺序列出操作步骤。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 日志或截图
      description: 请先移除 API Key、用户名、文件路径等敏感信息。
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue，未发现重复报告。
          required: true
        - label: 此报告不包含真实凭据或其他敏感信息。
          required: true
