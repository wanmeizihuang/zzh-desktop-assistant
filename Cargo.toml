[workspace]
members = [
    "apps/desktop",
    "crates/agent-core",
    "crates/agent-cli",
    "crates/agent-http",
    "crates/app-core",
    "crates/system-monitor",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.97"
version = "0.1.2"

[workspace.dependencies]
agent-core = { path = "crates/agent-core" }
agent-cli = { path = "crates/agent-cli" }
agent-http = { path = "crates/agent-http" }
app-core = { path = "crates/app-core" }
system-monitor = { path = "crates/system-monitor" }
slint = { version = "=1.17.1", default-features = false, features = [
    "backend-winit",
    "compat-1-2",
    "image-default-formats",
    "renderer-software",
    "software-renderer-systemfonts",
    "std",
    "system-tray",
    "unstable-winit-030",
] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
eventsource-stream = "=0.2.3"
futures-util = "=0.3.33"
reqwest = { version = "=0.12.28", default-features = false, features = [
    "json",
    "rustls-tls",
    "stream",
] }
tokio = { version = "=1.53.1", features = ["macros", "rt", "time"] }
url = "=2.5.8"
zeroize = "=1.9.0"
windows = { version = "=0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_DXCore",
    "Win32_Graphics_Gdi",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Security",
    "Win32_Security_Credentials",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Performance",
    "Win32_System_Pipes",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Services",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
panic = "abort"
strip = "symbols"
