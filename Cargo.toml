[workspace]
members = [
    "apps/desktop",
    "crates/app-core",
    "crates/system-monitor",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.97"
version = "0.1.0"

[workspace.dependencies]
app-core = { path = "crates/app-core" }
system-monitor = { path = "crates/system-monitor" }
slint = { version = "=1.17.1", default-features = false, features = [
    "backend-winit",
    "compat-1-2",
    "image-default-formats",
    "renderer-software",
    "software-renderer-systemfonts",
    "std",
    "unstable-winit-030",
] }
windows = { version = "=0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_System_Performance",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
panic = "abort"
strip = "symbols"
